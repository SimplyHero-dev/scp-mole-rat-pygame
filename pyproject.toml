[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "scp"
version = "1.0"
description =  "A tower defense game built in Python using pygame"
readme = "README.md"
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
]
dependencies = [
    "click==8.*",
    "pygame-ce==2.*",
    "structlog",
]

[project.scripts]
scp = "scp.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"scp.assets.gfx" = ["*.png"]
"scp.assets.audio" = ["*.wav", "*.ogg"]
"scp.assets.levels" = ["*.json"]
